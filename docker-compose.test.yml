services:
  app-test:
    container_name: app-test
    build:
      context: .
      dockerfile: Dockerfile.test
    env_file:
      - .env
    environment:
      - NODE_ENV=test
      # Habilita suporte ESM para o node usar o jest
      - NODE_OPTIONS=--experimental-vm-modules
    depends_on:
      db-test:
        condition: service_healthy
    command: ["npm", "run", "test"]

  db-test:
    container_name: db-test
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-product_stock_manager_test}
    ports:
      - "5433:5432" # Porta diferente pra não conflitar com o banco normal caso suba os dois
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_stock_manager_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Podemos não usar volume aqui para que a cada rebuild de teste o banco suba limpo, 
    # ou usar um se for o caso. Por ser test, subir limpo é ideal.
