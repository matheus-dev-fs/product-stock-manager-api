services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
      - ./public/avatars:/app/public/avatars
      - /app/node_modules
    depends_on:
      - db

  db:
    container_name: db
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-product_stock_manager}
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: